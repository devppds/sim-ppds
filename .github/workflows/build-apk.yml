name: Build Android APK

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build APK
        run: |
          cd android
          gradle assembleRelease

      - name: Copy APK to public folder
        run: |
          mkdir -p public/download
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk public/download/SIM-PPDS.apk

      - name: Commit and Push APK
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add public/download/SIM-PPDS.apk
          git diff-index --quiet HEAD || (git commit -m "Auto-build Android APK [skip ci]" && git push origin master)

      - name: Upload APK ke Release sim-ppds-release
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          set -e

          echo "=== Cek token ==="
          if [ -z "$RELEASE_PAT" ]; then
            echo "ERROR: RELEASE_PAT secret kosong!"
            exit 1
          fi

          echo "=== Ambil release terbaru dari sim-ppds-release ==="
          RELEASE=$(curl -sf \
            -H "Authorization: token $RELEASE_PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/devppds/sim-ppds-release/releases/latest)

          echo "API Response: $RELEASE"

          if ! echo "$RELEASE" | jq -e '.id' > /dev/null 2>&1; then
            echo "ERROR: $(echo "$RELEASE" | jq -r '.message // "Unknown error - token mungkin tidak punya akses"')"
            exit 1
          fi

          RELEASE_ID=$(echo "$RELEASE" | jq -r '.id')
          RELEASE_TAG=$(echo "$RELEASE" | jq -r '.tag_name')
          echo "Target release: $RELEASE_TAG (ID: $RELEASE_ID)"

          echo "=== Hapus asset APK lama jika ada ==="
          ASSETS=$(curl -sf \
            -H "Authorization: token $RELEASE_PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/devppds/sim-ppds-release/releases/$RELEASE_ID/assets")

          EXISTING_ASSET=$(echo "$ASSETS" | jq -r '.[] | select(.name == "SIM-PPDS.apk") | .id // empty')

          if [ -n "$EXISTING_ASSET" ]; then
            echo "Menghapus asset lama (ID: $EXISTING_ASSET)..."
            curl -sf -X DELETE \
              -H "Authorization: token $RELEASE_PAT" \
              "https://api.github.com/repos/devppds/sim-ppds-release/releases/assets/$EXISTING_ASSET"
            echo "Asset lama dihapus."
          fi

          echo "=== Upload APK ke release $RELEASE_TAG ==="
          UPLOAD_RESULT=$(curl -sf -X POST \
            -H "Authorization: token $RELEASE_PAT" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @public/download/SIM-PPDS.apk \
            "https://uploads.github.com/repos/devppds/sim-ppds-release/releases/$RELEASE_ID/assets?name=SIM-PPDS.apk")

          echo "Upload result: $UPLOAD_RESULT"

          DOWNLOAD_URL=$(echo "$UPLOAD_RESULT" | jq -r '.browser_download_url // empty')
          if [ -n "$DOWNLOAD_URL" ]; then
            echo "APK berhasil di-upload!"
            echo "Download URL: $DOWNLOAD_URL"
          else
            echo "Upload gagal: $(echo "$UPLOAD_RESULT" | jq -r '.message // "Unknown error"')"
            exit 1
          fi
