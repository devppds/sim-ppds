name: Build Android APK

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease

      - name: Copy APK to public folder
        run: |
          mkdir -p public/download
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk public/download/SIM-PPDS.apk
          echo "APK size: $(du -sh public/download/SIM-PPDS.apk)"

      - name: Commit and Push APK
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add public/download/SIM-PPDS.apk
          git diff-index --quiet HEAD || (git commit -m "Auto-build Android APK [skip ci]" && git push origin master)

      - name: Upload APK ke Release sim-ppds-release
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          set -e

          RELEASE=$(curl -s \
            -H "Authorization: token $RELEASE_PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/devppds/sim-ppds-release/releases/latest)

          echo "Release API response: $RELEASE"

          RELEASE_ID=$(echo "$RELEASE" | jq -r '.id')
          RELEASE_TAG=$(echo "$RELEASE" | jq -r '.tag_name')

          if [ "$RELEASE_ID" = "null" ] || [ -z "$RELEASE_ID" ]; then
            echo "ERROR: Tidak bisa ambil release. Response di atas."
            exit 1
          fi

          echo "Upload ke release: $RELEASE_TAG (ID: $RELEASE_ID)"

          ASSETS=$(curl -s \
            -H "Authorization: token $RELEASE_PAT" \
            "https://api.github.com/repos/devppds/sim-ppds-release/releases/$RELEASE_ID/assets")

          EXISTING=$(echo "$ASSETS" | jq -r '[.[] | select(.name == "SIM-PPDS.apk")] | first | .id // empty')

          if [ -n "$EXISTING" ]; then
            curl -s -X DELETE \
              -H "Authorization: token $RELEASE_PAT" \
              "https://api.github.com/repos/devppds/sim-ppds-release/releases/assets/$EXISTING"
            echo "APK lama dihapus"
          fi

          RESULT=$(curl -s -X POST \
            -H "Authorization: token $RELEASE_PAT" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @public/download/SIM-PPDS.apk \
            "https://uploads.github.com/repos/devppds/sim-ppds-release/releases/$RELEASE_ID/assets?name=SIM-PPDS.apk")

          echo "Upload result: $RESULT"

          DOWNLOAD_URL=$(echo "$RESULT" | jq -r '.browser_download_url // empty')
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "ERROR: Upload gagal - $(echo "$RESULT" | jq -r '.message // "unknown"')"
            exit 1
          fi

          echo "================================================"
          echo "APK BERHASIL DI-UPLOAD!"
          echo "Release : $RELEASE_TAG"
          echo "Download: $DOWNLOAD_URL"
          echo "================================================"
