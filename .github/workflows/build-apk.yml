name: Build Android APK

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build APK
        run: |
          cd android
          gradle assembleRelease

      - name: Copy APK to public folder
        run: |
          mkdir -p public/download
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk public/download/SIM-PPDS.apk

      - name: Commit and Push APK
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add public/download/SIM-PPDS.apk
          git diff-index --quiet HEAD || (git commit -m "Auto-build Android APK [skip ci]" && git push origin master)

      - name: Upload APK ke Release sim-ppds-release
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          echo "=== Cek token ==="
          if [ -z "$RELEASE_PAT" ]; then
            echo "❌ ERROR: RELEASE_PAT secret kosong!"
            exit 1
          fi

          echo "=== Ambil release terbaru dari sim-ppds-release ==="
          RELEASE=$(curl -s -H "Authorization: token $RELEASE_PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/devppds/sim-ppds-release/releases/latest)

          echo "API Response: $RELEASE"

          # Validasi response mengandung 'id'
          RELEASE_ID=$(echo "$RELEASE" | python3 -c "
import sys, json
data = json.load(sys.stdin)
if 'id' not in data:
    print('ERROR:', data.get('message', 'Unknown error'), file=sys.stderr)
    sys.exit(1)
print(data['id'])
")
          RELEASE_TAG=$(echo "$RELEASE" | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")

          echo "✅ Target release: $RELEASE_TAG (ID: $RELEASE_ID)"

          echo "=== Hapus asset APK lama jika ada ==="
          ASSETS=$(curl -s -H "Authorization: token $RELEASE_PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/devppds/sim-ppds-release/releases/$RELEASE_ID/assets")

          EXISTING_ASSET=$(echo "$ASSETS" | python3 -c "
import sys, json
assets = json.load(sys.stdin)
apk = [a for a in assets if a['name'] == 'SIM-PPDS.apk']
print(apk[0]['id'] if apk else '')
")

          if [ -n "$EXISTING_ASSET" ]; then
            echo "Menghapus asset lama (ID: $EXISTING_ASSET)..."
            curl -s -X DELETE \
              -H "Authorization: token $RELEASE_PAT" \
              "https://api.github.com/repos/devppds/sim-ppds-release/releases/assets/$EXISTING_ASSET"
            echo "Asset lama dihapus."
          fi

          echo "=== Upload APK ke release $RELEASE_TAG ==="
          UPLOAD_RESULT=$(curl -s -X POST \
            -H "Authorization: token $RELEASE_PAT" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @public/download/SIM-PPDS.apk \
            "https://uploads.github.com/repos/devppds/sim-ppds-release/releases/$RELEASE_ID/assets?name=SIM-PPDS.apk")

          echo "Upload result: $UPLOAD_RESULT"

          # Cek apakah upload berhasil
          echo "$UPLOAD_RESULT" | python3 -c "
import sys, json
data = json.load(sys.stdin)
if 'id' in data:
    print('✅ APK berhasil di-upload! Asset ID:', data['id'])
    print('Download URL:', data.get('browser_download_url', 'N/A'))
else:
    print('❌ Upload gagal:', data.get('message', 'Unknown error'))
    sys.exit(1)
"
